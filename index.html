<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KPSS Ortaöğretim Test Merkezi</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
padding:20px;
margin:0;
}

.container{
max-width:900px;
margin:auto;
background:#1e293b;
padding:25px;
border-radius:15px;
}

h1{
text-align:center;
}

#soru{
margin-top:20px;
font-size:24px;
}

.option{
display:block;
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:white;
color:black;
cursor:pointer;
font-size:16px;
}

.btn{
padding:12px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

#sonuc{
font-size:24px;
font-weight:bold;
margin-top:15px;
}

.info{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>KPSS ORTAÖĞRETİM TEST MERKEZİ</h1>

<div class="info">

<div>
Puan:
<span id="puan">0</span>
</div>

<div>
Çözülen:
<span id="sayac">0</span>
</div>

</div>

<hr>

<h2 id="soru">Yeni Soru butonuna bas.</h2>

<div id="secenekler"></div>

<div id="sonuc"></div>

<button class="btn" onclick="yeniSoru()">
Yeni Soru
</button>

</div>

<script>

let puan = 0;
let sayac = 0;
let aktifSoru = null;
let kullanilan = [];

const sorular = [

{
soru:"Cumhuriyet hangi tarihte ilan edilmiştir?",
secenekler:[
"23 Nisan 1920",
"29 Ekim 1923",
"30 Ağustos 1922",
"24 Temmuz 1923"
],
dogru:1
},

{
soru:"TBMM hangi tarihte açılmıştır?",
secenekler:[
"23 Nisan 1920",
"19 Mayıs 1919",
"29 Ekim 1923",
"30 Ağustos 1922"
],
dogru:0
},

{
soru:"İstiklal Marşı'nın yazarı kimdir?",
secenekler:[
"Mehmet Akif Ersoy",
"Namık Kemal",
"Yahya Kemal",
"Ziya Gökalp"
],
dogru:0
},

{
soru:"Türkiye'nin başkenti hangisidir?",
secenekler:[
"İstanbul",
"Ankara",
"İzmir",
"Bursa"
],
dogru:1
},

{
soru:"Türkiye'nin en uzun akarsuyu hangisidir?",
secenekler:[
"Kızılırmak",
"Fırat",
"Aras",
"Sakarya"
],
dogru:0
}

];

function yeniSoru(){

if(kullanilan.length >= sorular.length){

document.getElementById("soru").innerHTML =
"Soru havuzu tamamlandı.";

document.getElementById("secenekler").innerHTML = "";

return;
}

let no;

do{

no = Math.floor(Math.random()*sorular.length);

}
while(kullanilan.includes(no));

kullanilan.push(no);

aktifSoru = sorular[no];

document.getElementById("soru").innerHTML =
aktifSoru.soru;

let html = "";

for(let i=0;i<aktifSoru.secenekler.length;i++){

html += `
<button
class="option"
onclick="cevapla(${i})">
${aktifSoru.secenekler[i]}
</button>
`;

}

document.getElementById("secenekler").innerHTML =
html;

document.getElementById("sonuc").innerHTML = "";

}

function cevapla(secim){

sayac++;

document.getElementById("sayac").innerHTML =
sayac;

if(secim === aktifSoru.dogru){

puan += 10;

document.getElementById("puan").innerHTML =
puan;

document.getElementById("sonuc").innerHTML =
"✅ DOĞRU";

document.getElementById("sonuc").style.color =
"#22c55e";

}
else{

document.getElementById("sonuc").innerHTML =
"❌ YANLIŞ";

document.getElementById("sonuc").style.color =
"#ef4444";

}

}

</script>

</body>
</html>
