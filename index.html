function yeniSoru(){

if(kullanilan.length >= sorular.length){

document.getElementById("soru").innerHTML =
"Soru havuzu tamamlandı.";

document.getElementById("secenekler").innerHTML = "";

return;
}

let no;

do{

no = Math.floor(Math.random()*sorular.length);

}
while(kullanilan.includes(no));

kullanilan.push(no);

aktifSoru = sorular[no];

document.getElementById("soru").innerHTML =
aktifSoru.soru;

let html = "";

for(let i=0;i<aktifSoru.secenekler.length;i++){

html += `
<button
class="option"
onclick="cevapla(${i})">
${aktifSoru.secenekler[i]}
</button>
`;

}

document.getElementById("secenekler").innerHTML =
html;

document.getElementById("sonuc").innerHTML = "";

}

function cevapla(secim){

sayac++;

document.getElementById("sayac").innerHTML =
sayac;

puan += 10;

document.getElementById("puan").innerHTML =
puan;

"✅ DOĞRU";
